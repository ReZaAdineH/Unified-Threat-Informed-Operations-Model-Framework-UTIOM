title: "[Q&A] "
body:
  - type: markdown
    attributes:
      value: |
        Use this category for questions about applying or interpreting UTIOM. If you have found a concrete documentation error or want a tracked repository change, open an Issue instead.
  - type: textarea
    id: question
    attributes:
      label: Question
      placeholder: What are you trying to understand or apply?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe your environment, maturity, use case, or constraint where useful. Do not include confidential information.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: UTIOM area
      options:
        - Vision
        - Strategy
        - Crown Jewels
        - Threat Visibility
        - Threat Detection
        - Response
        - Continuous Improvement
        - Cross-lifecycle / V-Model
        - Assessment Toolkit
        - Framework Family / Standards Mapping
    validations:
      required: true

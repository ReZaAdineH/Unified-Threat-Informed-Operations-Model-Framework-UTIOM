<svg viewBox="0 0 1180 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The UTIOM operating model. Three pillars containing seven phases, each labelled with the NIST CSF and ISO 27001 references it maps to. Leadership and Governance holds Vision, Strategy and Crown Jewels. Engineering and Enablement holds Threat Visibility and Threat Detection, joined by an iterative loop, and is the span TID-CMM measures. Operations and Analysis holds Response and Continuous Improvement, the span TIR-CMM measures. Two OODA cycles run at different tempos: a fast one between engineering and operations at incident tempo, and a slower decision-making one carrying operational reality back to leadership." style="--p-lead: #A79FE8; --p-lead-soft: #221E3C; --p-eng: #5FC9B2; --p-eng-soft: #0F2E2A; --p-ops: #E0B071; --p-ops-soft: #2E2312; --p-ink: #E8EAE7; --p-mute: #98A2AC; --p-rule: #2E3339; --p-panel: #171B1F; color: rgb(232, 234, 231);"><defs><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--p-mute)"></path></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--p-lead)"></path></marker><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="var(--p-ops)"></path></marker></defs><rect x="0" y="0" width="1180" height="760" fill="#101316"></rect><text x="26" y="36" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" letter-spacing="1.6" font-weight="600" fill="var(--p-ink)">THE OPERATING MODEL</text><text x="26" y="62" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="13.5" fill="var(--p-mute)">Three pillars, seven phases, and the two OODA cycles that turn fragmented operations into an adaptive control system.</text><rect x="22" y="96" width="902" height="176" rx="11" fill="var(--p-lead-soft)" stroke="var(--p-lead)" stroke-width="1.2"></rect><text x="46" y="177.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.7" font-weight="600" fill="var(--p-lead)">LEADERSHIP</text><text x="46" y="198.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.7" font-weight="600" fill="var(--p-lead)">AND GOVERNANCE</text><rect x="214" y="114" width="200" height="140" rx="9" fill="var(--p-panel)" stroke="var(--p-lead)" stroke-width="1.5"></rect><circle cx="241" cy="141" r="13" fill="none" stroke="var(--p-lead)" stroke-width="1.4"></circle><text x="241" y="146" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--p-lead)" text-anchor="middle">1</text><text x="264" y="147" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--p-ink)">Vision</text><text x="234" y="172" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">strategic direction</text><text x="234" y="191" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">purpose and metrics</text><line x1="215" y1="228" x2="413" y2="228" stroke="var(--p-lead)" stroke-width="1" opacity="0.35"></line><text x="234" y="243" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="0.3" fill="var(--p-lead)">GV.OC · Clause 5</text><rect x="444" y="114" width="200" height="140" rx="9" fill="var(--p-panel)" stroke="var(--p-lead)" stroke-width="1.5"></rect><circle cx="471" cy="141" r="13" fill="none" stroke="var(--p-lead)" stroke-width="1.4"></circle><text x="471" y="146" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--p-lead)" text-anchor="middle">2</text><text x="494" y="147" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--p-ink)">Strategy</text><text x="464" y="172" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">SecOps strategy, KPIs</text><text x="464" y="191" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">threat profiling</text><line x1="445" y1="228" x2="643" y2="228" stroke="var(--p-lead)" stroke-width="1" opacity="0.35"></line><text x="464" y="243" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="0.3" fill="var(--p-lead)">GV.RM · Clauses 6–8</text><rect x="674" y="114" width="230" height="140" rx="9" fill="var(--p-panel)" stroke="var(--p-lead)" stroke-width="1.5"></rect><circle cx="701" cy="141" r="13" fill="none" stroke="var(--p-lead)" stroke-width="1.4"></circle><text x="701" y="146" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--p-lead)" text-anchor="middle">3</text><text x="724" y="147" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--p-ink)">Crown jewels</text><text x="694" y="172" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">attack paths, risk scores</text><text x="694" y="191" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="var(--p-mute)">priority lens for business</text><text x="694" y="206" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="var(--p-mute)">impact; scope includes</text><text x="694" y="221" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="var(--p-mute)">dependencies and enabling systems</text><line x1="675" y1="228" x2="903" y2="228" stroke="var(--p-lead)" stroke-width="1" opacity="0.35"></line><text x="694" y="243" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="0.3" fill="var(--p-lead)">ID.AM · A.5.9, A.5.12</text><path d="M414,184 L436,184" stroke="var(--p-mute)" stroke-width="1.6" marker-end="url(#a1)"></path><path d="M644,184 L666,184" stroke="var(--p-mute)" stroke-width="1.6" marker-end="url(#a1)"></path><circle cx="685" cy="295" r="10" fill="none" stroke="var(--p-lead)" stroke-width="1.3"></circle><path d="M680,295 l3.5,3.5 l6,-7" fill="none" stroke="var(--p-lead)" stroke-width="1.5"></path><text x="704" y="291" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)"><tspan font-weight="600" fill="var(--p-ink)">Guardrails:</tspan> preventive controls, boundaries,</text><text x="704" y="308" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">exceptions, failures, bypasses.</text><rect x="22" y="312" width="902" height="172" rx="11" fill="var(--p-eng-soft)" stroke="var(--p-eng)" stroke-width="1.2"></rect><text x="46" y="391.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.7" font-weight="600" fill="var(--p-eng)">ENGINEERING</text><text x="46" y="412.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.7" font-weight="600" fill="var(--p-eng)">AND ENABLEMENT</text><rect x="214" y="330" width="216" height="136" rx="9" fill="var(--p-panel)" stroke="var(--p-eng)" stroke-width="1.5"></rect><circle cx="241" cy="357" r="13" fill="none" stroke="var(--p-eng)" stroke-width="1.4"></circle><text x="241" y="362" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--p-eng)" text-anchor="middle">4</text><text x="264" y="363" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--p-ink)">Threat visibility</text><text x="234" y="388" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">telemetry architecture</text><text x="234" y="407" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">DeTT&amp;CT, TID-CMM</text><line x1="215" y1="440" x2="429" y2="440" stroke="var(--p-eng)" stroke-width="1" opacity="0.35"></line><text x="234" y="455" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="0.3" fill="var(--p-eng)">DE.CM · A.8.15, A.8.16</text><rect x="640" y="330" width="268" height="136" rx="9" fill="var(--p-panel)" stroke="var(--p-eng)" stroke-width="1.5"></rect><circle cx="667" cy="357" r="13" fill="none" stroke="var(--p-eng)" stroke-width="1.4"></circle><text x="667" y="362" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--p-eng)" text-anchor="middle">5</text><text x="690" y="363" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--p-ink)">Threat detection</text><text x="660" y="388" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">detection-as-code</text><text x="660" y="407" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">ATT&amp;CK, Sigma, TID-CMM</text><line x1="641" y1="440" x2="907" y2="440" stroke="var(--p-eng)" stroke-width="1" opacity="0.35"></line><text x="660" y="455" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="0.3" fill="var(--p-eng)">DE.AE · A.8.16, A.5.7</text><path d="M789.0,272 L789.0,282 L322.0,282 L322.0,324" fill="none" stroke="var(--p-mute)" stroke-width="1.6" marker-end="url(#a1)"></path><path d="M436,364 C495.0,342 575.0,342 634,364" fill="none" stroke="var(--p-mute)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a1)"></path><path d="M634,436 C575.0,458 495.0,458 436,436" fill="none" stroke="var(--p-mute)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a1)"></path><text x="535.0" y="382" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="11.5" fill="var(--p-mute)" text-anchor="middle">detection requirements</text><text x="535.0" y="399" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="11.5" fill="var(--p-mute)" text-anchor="middle">drive telemetry needs;</text><text x="535.0" y="416" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="11.5" fill="var(--p-mute)" text-anchor="middle">telemetry validation</text><text x="535.0" y="433" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="11.5" fill="var(--p-mute)" text-anchor="middle">informs detection engineering</text><rect x="22" y="524" width="902" height="152" rx="11" fill="var(--p-ops-soft)" stroke="var(--p-ops)" stroke-width="1.2"></rect><text x="46" y="593.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.7" font-weight="600" fill="var(--p-ops)">OPERATIONS</text><text x="46" y="614.0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" letter-spacing="0.7" font-weight="600" fill="var(--p-ops)">AND ANALYSIS</text><rect x="214" y="540" width="244" height="120" rx="9" fill="var(--p-panel)" stroke="var(--p-ops)" stroke-width="1.5"></rect><circle cx="241" cy="567" r="13" fill="none" stroke="var(--p-ops)" stroke-width="1.4"></circle><text x="241" y="572" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--p-ops)" text-anchor="middle">6</text><text x="264" y="573" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--p-ink)">Response</text><text x="234" y="598" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">incident handling, SOAR</text><text x="234" y="617" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">containment, recovery</text><line x1="215" y1="634" x2="457" y2="634" stroke="var(--p-ops)" stroke-width="1" opacity="0.35"></line><text x="234" y="649" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="0.3" fill="var(--p-ops)">RS.MA · A.5.24–A.5.28</text><rect x="488" y="540" width="282" height="120" rx="9" fill="var(--p-panel)" stroke="var(--p-ops)" stroke-width="1.5"></rect><circle cx="515" cy="567" r="13" fill="none" stroke="var(--p-ops)" stroke-width="1.4"></circle><text x="515" y="572" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="var(--p-ops)" text-anchor="middle">7</text><text x="538" y="573" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="var(--p-ink)">Continuous improvement</text><text x="508" y="598" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">Kaizen, PDCA</text><text x="508" y="617" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12.5" fill="var(--p-mute)">updated strategy</text><line x1="489" y1="634" x2="769" y2="634" stroke="var(--p-ops)" stroke-width="1" opacity="0.35"></line><text x="508" y="649" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10.5" letter-spacing="0.3" fill="var(--p-ops)">ID.IM, RC.CO · Clause 10</text><path d="M458,600 L480,600" stroke="var(--p-mute)" stroke-width="1.6" marker-end="url(#a1)"></path><path d="M774,484 L774,502 L336,502 L336,534" fill="none" stroke="var(--p-mute)" stroke-width="1.6" marker-end="url(#a1)"></path><path d="M8,318 L0,318 L0,478 L8,478" fill="none" stroke="var(--p-eng)" stroke-width="1.4"></path><g transform="translate(-14,398.0) rotate(-90)"><text x="0" y="0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="var(--p-eng)" text-anchor="middle">TID-CMM</text><text x="0" y="14" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="10" fill="var(--p-mute)" text-anchor="middle">measures this span</text></g><path d="M8,530 L0,530 L0,670 L8,670" fill="none" stroke="var(--p-ops)" stroke-width="1.4"></path><g transform="translate(-14,600.0) rotate(-90)"><text x="0" y="0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="var(--p-ops)" text-anchor="middle">TIR-CMM</text><text x="0" y="14" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="10" fill="var(--p-mute)" text-anchor="middle">measures this span</text></g><path d="M150,458.0 A26,46 0 0 1 150,550.0" fill="none" stroke="var(--p-ops)" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a4)"></path><path d="M150,550.0 A26,46 0 0 1 150,458.0" fill="none" stroke="var(--p-ops)" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a4)"></path><path d="M150,454.0 L150,478" fill="none" stroke="var(--p-ops)" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.7"></path><path d="M150,554.0 L150,530" fill="none" stroke="var(--p-ops)" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.7"></path><g transform="translate(106,504.0) rotate(-90)"><text x="0" y="0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="0.6" font-weight="600" fill="var(--p-ops)" text-anchor="middle">OODA loop</text><text x="0" y="16" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="10.5" fill="var(--p-mute)" text-anchor="middle">at incident tempo</text></g><path d="M924,600.0 L970,600.0 L970,184.0 L930,184.0" fill="none" stroke="var(--p-lead)" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#a3)"></path><g transform="translate(996,392.0) rotate(90)"><text x="0" y="0" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="0.6" font-weight="600" fill="var(--p-lead)" text-anchor="middle">Decision-making loop</text><text x="0" y="16" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="10.5" fill="var(--p-mute)" text-anchor="middle">OODA at strategic tempo</text></g><line x1="22" y1="692" x2="1150" y2="692" stroke="var(--p-rule)" stroke-width="1"></line><text x="22" y="716" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="12" fill="var(--p-mute)">Each phase consumes and produces knowledge; the output of one becomes the input to the next. Both loops are OODA cycles — they differ only in tempo.</text><text x="1166" y="752" text-anchor="end" font-family="IBM Plex Sans, system-ui, -apple-system, sans-serif" font-size="9.5" fill="currentColor" opacity="0.45">© Reza Adineh · utiom.de</text></svg>
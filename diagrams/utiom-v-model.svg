<title id="vt">The UTIOM V-Model</title>
<desc id="vd">A V-shaped diagram. The left arm descends through Vision, Strategy, Crown Jewels and Threat Visibility as design decisions. Detection Engineering sits at the base. The right arm ascends through Detection QA, Purple Team, Response and Improvement as validation activities. Dashed horizontal links pair each design decision with the activity that proves it.</desc>

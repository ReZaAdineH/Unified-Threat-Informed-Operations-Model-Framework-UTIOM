server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # These tools handle sensitive self-assessment data.
    # Access logging is disabled by default so that usage is not recorded.
    # Set to /var/log/nginx/access.log if your environment requires it.
    access_log  off;
    error_log   /var/log/nginx/error.log warn;

    server_tokens off;

    add_header X-Content-Type-Options   "nosniff"                 always;
    add_header X-Frame-Options          "SAMEORIGIN"              always;
    add_header Referrer-Policy          "no-referrer"             always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # No external dependencies. IBM Plex is served from /fonts and all
    # JavaScript from /js, so this runs air-gapped with no network egress.
    add_header Content-Security-Policy  "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'; object-src 'none'" always;

    location /js/    { add_header Cache-Control "public, max-age=604800"; }
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }
}

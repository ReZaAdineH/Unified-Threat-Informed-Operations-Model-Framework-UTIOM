services:
  utiom-tools:
    build: .
    image: utiom/assessment-toolkit:1.3
    container_name: utiom-tools
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      # uid 101 is nginx in the alpine image. The tmpfs mounts sit on top of
      # paths the Dockerfile already chowned, so without an explicit uid the
      # container would get root-owned, unwritable directories and nginx would
      # fail to write its pid and cache as a non-root user.
      - /tmp:uid=101,gid=101,mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No capabilities are added back. The image runs USER nginx, ownership and
    # permissions are set at build time, and the listener is on 8080, so the
    # runtime needs neither CHOWN/SETGID/SETUID (nothing drops privilege) nor
    # NET_BIND_SERVICE (the port is above 1024).
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
